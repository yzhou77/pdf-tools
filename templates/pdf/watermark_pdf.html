{% extends 'layout.html' %}
{% block content %}
<div class="container main-content">
    <h2 class="pb-2 text-danger">Watermark PDF</h2>
    <form id="watermarkForm" action="{{ url_for('watermark_pdf') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group mt-4">
            <label for="file">Select file to be watermarked</label><br>
            <input type="file" name="file" accept="{{ UPLOAD_ACCEPT }}" required>
        </div>
        <div class="form-group">
            <label for="watermark_file">Select watermark file</label><br>
            <input type="file" name="watermark_file" accept="{{ UPLOAD_ACCEPT }}" required>
        </div>
        <div class="form-group">
            <label>Select page(s) to be watermarked</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="typeOfWatermark" id="wmFirst" value="first" checked>
                <label class="form-check-label" for="wmFirst">First Page</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="typeOfWatermark" id="wmAll" value="all">
                <label class="form-check-label" for="wmAll">All Pages</label>
            </div>
        </div>
        <div id="wmError" class="alert alert-danger mt-3 d-none"></div>
        <div id="wmSuccess" class="alert alert-success mt-3 d-none">
            Your watermarked PDF is ready.
            <a id="wmDownloadBtn" href="#" class="btn btn-success btn-sm ml-2" download>
                <i class="fa fa-download"></i> Download
            </a>
        </div>
        <button type="submit" id="wmBtn" class="btn btn-danger">Watermark</button>
        <button type="reset" class="btn btn-secondary">Cancel</button>
    </form>
</div>
<script>
(function () {
    var form   = document.getElementById('watermarkForm');
    var errBox = document.getElementById('wmError');
    var okBox  = document.getElementById('wmSuccess');
    var dlBtn  = document.getElementById('wmDownloadBtn');
    var btn    = document.getElementById('wmBtn');
    // --- Reset stale state -------------------------------------------------
    // Without this, a previous run's green "Download" panel stayed on screen
    // after the user picked a different file, so they could download the wrong
    // (older) result. Also wire Cancel, which was a bare type="reset" and left
    // the banners behind.
    function clearBanners() {
        errBox.classList.add('d-none');
        okBox.classList.add('d-none');
    }
    Array.prototype.forEach.call(form.querySelectorAll('input[type="file"]'), function (inp) {
        inp.addEventListener('change', clearBanners);
    });
    Array.prototype.forEach.call(form.querySelectorAll('button[type="reset"]'), function (b) {
        b.addEventListener('click', function () {
            setTimeout(function () {
                clearBanners();
                rotateBtn.disabled = false;
                rotateBtn.textContent = 'Rotate';
            }, 0);
        });
    });
    form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        errBox.classList.add('d-none');
        okBox.classList.add('d-none');
        var fd = new FormData(form);
        btn.disabled = true;
        btn.textContent = 'Processing...';
        fetch(form.action, { method: 'POST', body: fd })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
            .then(function (res) {
                if (res.ok && res.body.success) {
                    dlBtn.href = res.body.url;
                    dlBtn.setAttribute('download', res.body.name || 'watermarked.pdf');
                    okBox.classList.remove('d-none');
                } else {
                    errBox.textContent = (res.body && res.body.error) || 'Watermark failed.';
                    errBox.classList.remove('d-none');
                }
            })
            .catch(function (e) {
                errBox.textContent = 'Network error: ' + e;
                errBox.classList.remove('d-none');
            })
            .finally(function () {
                btn.disabled = false;
                btn.textContent = 'Watermark';
            });
    });
})();
</script>
{% endblock %}
