{% extends 'layout.html' %}
{% block content %}
<div class="container main-content main-content--wide">
    <h2 class="pb-2 text-danger">Organize PDF</h2>

    <form id="orgForm" action="{{ url_for('organize_pdf_view') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group mt-4">
            <label for="orgFile">Select a file</label>
            <input type="file" id="orgFile" name="file" accept="{{ UPLOAD_ACCEPT }}" required>
            <small class="text-muted d-block mt-1">
                PDF, JPG, PNG, Word, Excel and PowerPoint files are accepted
                (non-PDFs are converted to PDF first on the server).
            </small>
            <p id="fileInfo" class="mt-2 mb-0 text-muted">
                <em>Upload a file to manage its pages.</em>
            </p>
        </div>

        <!-- Toolbar -->
        <div id="orgToolbar" class="org-toolbar d-none">
            <span class="org-group-label">Select</span>
            <button type="button" class="btn-action" id="btnSelectAll" title="Select all pages">All</button>
            <button type="button" class="btn-action" id="btnSelectNone" title="Clear the selection">None</button>
            <button type="button" class="btn-action" id="btnSelectInvert" title="Invert the selection">Invert</button>

            <span class="divider"></span>

            <span class="org-group-label">Move</span>
            <button type="button" class="btn-action" id="btnMoveLeft" title="Move selected page(s) left" disabled>
                <i class="fa fa-arrow-left"></i> Left
            </button>
            <button type="button" class="btn-action" id="btnMoveRight" title="Move selected page(s) right" disabled>
                Right <i class="fa fa-arrow-right"></i>
            </button>

            <span class="divider"></span>

            <span class="org-group-label">Page</span>
            <button type="button" class="btn-action" id="btnRotateLeft" title="Rotate selected page(s) 90° counter-clockwise" disabled>
                <i class="fa fa-rotate-left"></i> 90°
            </button>
            <button type="button" class="btn-action" id="btnRotateRight" title="Rotate selected page(s) 90° clockwise" disabled>
                <i class="fa fa-rotate-right"></i> 90°
            </button>
            <button type="button" class="btn-action" id="btnDuplicate" title="Duplicate selected page(s)" disabled>
                <i class="fa fa-clone"></i> Duplicate
            </button>
            <button type="button" class="btn-action" id="btnDelete" title="Delete selected page(s)" disabled>
                <i class="fa fa-trash"></i> Delete
            </button>

            <span class="divider"></span>

            <span class="org-group-label">Insert</span>
            <span class="org-insert-pos">
                <label class="mb-0"><input type="radio" name="insertPos" value="before"> before</label>
                <label class="mb-0"><input type="radio" name="insertPos" value="after" checked> after</label>
            </span>
            <button type="button" class="btn-action" id="btnInsertPdf" title="Insert PDF / image / Office file page(s)" disabled>
                <i class="fa fa-file-pdf-o"></i> Insert file
            </button>
            <input type="number" id="blankCount" class="form-control form-control-sm org-blank-count"
                   min="1" max="50" value="1" title="How many blank pages to insert">
            <button type="button" class="btn-action" id="btnInsertBlank" title="Insert blank page(s)" disabled>
                <i class="fa fa-file-o"></i> Insert blank
            </button>

            <span class="divider"></span>

            <button type="button" class="btn-action" id="btnUndo" title="Undo" disabled>
                <i class="fa fa-undo"></i> Undo
            </button>
            <button type="button" class="btn-action" id="btnRedo" title="Redo" disabled>
                <i class="fa fa-repeat"></i> Redo
            </button>
        </div>

        <!-- Page management area -->
        <div id="orgGrid" class="org-grid d-none"></div>
        <div id="orgStatus" class="org-status d-none"></div>

        <!-- Hidden picker for "Insert file" -->
        <input type="file" id="insertPicker" accept="{{ UPLOAD_ACCEPT }}" multiple style="display:none">

        <div id="orgError"   class="alert alert-danger  mt-3 d-none"></div>
        <div id="orgSuccess" class="alert alert-success mt-3 d-none">
            <div id="orgSummary"></div>
            <a id="orgDownloadBtn" href="#" class="btn btn-success btn-sm mt-2" download>
                <i class="fa fa-download"></i> Download
            </a>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-danger mt-2" disabled>Save &amp; Download</button>
        <button type="button" id="cancelBtn" class="btn btn-secondary mt-2">Cancel</button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="{{ url_for('static', filename='pdf_helpers.js') }}"></script>
<script>
(function () {
    PDFHelpers.setupPdfJs();

    // ------------------------------------------------------------- state
    // pages: ordered plan. Each entry is one of
    //   { uid, src:'main'|'insert_N', page:<1-based>, rotate:0|90|180|270 }
    //   { uid, src:'blank', width, height }
    var pages        = [];
    var sourceFiles  = {};   // key -> File/Blob to upload   ('main', 'insert_0', ...)
    var sourceDocs   = {};   // key -> pdf.js document (for thumbnails)
    var sourceNames  = {};   // key -> display name
    var insertSeq    = 0;
    var uidSeq       = 0;
    var thumbCache   = {};   // "key:page" -> dataURL
    var undoStack    = [];
    var redoStack    = [];
    var anchorIndex  = null; // last clicked page (insert anchor)

    // ------------------------------------------------------------- DOM
    var form        = document.getElementById('orgForm');
    var fileInput   = document.getElementById('orgFile');
    var fileInfo    = document.getElementById('fileInfo');
    var toolbar     = document.getElementById('orgToolbar');
    var grid        = document.getElementById('orgGrid');
    var statusLine  = document.getElementById('orgStatus');

    var btnSelectAll    = document.getElementById('btnSelectAll');
    var btnSelectNone   = document.getElementById('btnSelectNone');
    var btnSelectInvert = document.getElementById('btnSelectInvert');
    var btnMoveLeft     = document.getElementById('btnMoveLeft');
    var btnMoveRight    = document.getElementById('btnMoveRight');
    var btnRotateLeft   = document.getElementById('btnRotateLeft');
    var btnRotateRight  = document.getElementById('btnRotateRight');
    var btnDuplicate    = document.getElementById('btnDuplicate');
    var btnDelete       = document.getElementById('btnDelete');
    var btnInsertPdf    = document.getElementById('btnInsertPdf');
    var btnInsertBlank  = document.getElementById('btnInsertBlank');
    var blankCount      = document.getElementById('blankCount');
    var insertPicker    = document.getElementById('insertPicker');
    var btnUndo         = document.getElementById('btnUndo');
    var btnRedo         = document.getElementById('btnRedo');

    var errBox    = document.getElementById('orgError');
    var okBox     = document.getElementById('orgSuccess');
    var summary   = document.getElementById('orgSummary');
    var dlBtn     = document.getElementById('orgDownloadBtn');
    var saveBtn   = document.getElementById('saveBtn');
    var cancelBtn = document.getElementById('cancelBtn');

    // ------------------------------------------------------------- helpers
    function hideMessages() { errBox.classList.add('d-none'); okBox.classList.add('d-none'); }
    function showError(m)   { errBox.textContent = m; errBox.classList.remove('d-none'); }
    function humanSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1024 / 1024).toFixed(1) + ' MB';
    }
    function nextUid()  { return 'u' + (++uidSeq); }
    function selectedIdx() {
        var out = [];
        pages.forEach(function (p, i) { if (p.selected) out.push(i); });
        return out;
    }
    function insertPos() {
        var r = document.querySelector('input[name="insertPos"]:checked');
        return r ? r.value : 'after';
    }

    // ------------------------------------------------------------- history
    function clonePages() {
        return pages.map(function (p) {
            return {
                uid: p.uid, src: p.src, page: p.page, rotate: p.rotate,
                width: p.width, height: p.height,
                selected: p.selected, label: p.label,
                __wpt: p.__wpt, __hpt: p.__hpt,
            };
        });
    }
    function pushHistory() {
        undoStack.push(clonePages());
        if (undoStack.length > 60) undoStack.shift();
        redoStack.length = 0;
        updateButtons();
    }
    btnUndo.addEventListener('click', function () {
        if (!undoStack.length) return;
        redoStack.push(clonePages());
        pages = undoStack.pop();
        anchorIndex = null;
        render();
    });
    btnRedo.addEventListener('click', function () {
        if (!redoStack.length) return;
        undoStack.push(clonePages());
        pages = redoStack.pop();
        anchorIndex = null;
        render();
    });

    // ------------------------------------------------------------- thumbnails
    function thumbKey(p) { return p.src + ':' + p.page; }

    function ensureThumb(p, imgEl) {
        if (p.src === 'blank') return;
        var key = thumbKey(p);
        if (thumbCache[key]) { imgEl.src = thumbCache[key]; return; }
        var doc = sourceDocs[p.src];
        if (!doc) return;
        doc.getPage(p.page).then(function (page) {
            var vp = page.getViewport({ scale: 0.3 });
            var c = document.createElement('canvas');
            c.width = vp.width; c.height = vp.height;
            return page.render({ canvasContext: c.getContext('2d'), viewport: vp })
                .promise.then(function () {
                    thumbCache[key] = c.toDataURL();
                    imgEl.src = thumbCache[key];
                });
        }).catch(function () { /* ignore thumbnail failures */ });
    }

    // ------------------------------------------------------------- rendering
    function render() {
        grid.innerHTML = '';
        if (pages.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'org-empty';
            empty.innerHTML = '<em>No pages left. Use Undo to restore, or insert a page.</em>';
            grid.appendChild(empty);
        }

        pages.forEach(function (p, idx) {
            var cell = document.createElement('div');
            cell.className = 'org-page' + (p.selected ? ' selected' : '');
            cell.draggable = true;
            cell.dataset.index = idx;

            var badge = document.createElement('span');
            badge.className = 'org-badge';
            badge.textContent = idx + 1;
            cell.appendChild(badge);

            if (p.src !== 'main') {
                var tag = document.createElement('span');
                tag.className = 'org-tag';
                tag.textContent = (p.src === 'blank') ? 'BLANK' : 'NEW';
                cell.appendChild(tag);
            }

            var box = document.createElement('div');
            box.className = 'org-thumb-box';
            if (p.src === 'blank') {
                var face = document.createElement('div');
                face.className = 'org-blank-face';
                face.textContent = 'blank';
                box.appendChild(face);
            } else {
                var img = document.createElement('img');
                img.alt = 'page ' + p.page;
                img.style.transform = 'rotate(' + (p.rotate || 0) + 'deg)';
                box.appendChild(img);
                ensureThumb(p, img);
            }
            cell.appendChild(box);

            var label = document.createElement('span');
            label.className = 'org-label';
            if (p.src === 'blank') {
                label.textContent = 'Blank';
            } else if (p.src === 'main') {
                label.textContent = 'Orig p' + p.page + (p.rotate ? ' · ' + p.rotate + '°' : '');
            } else {
                label.textContent = (p.label || 'Ins') + ' p' + p.page + (p.rotate ? ' · ' + p.rotate + '°' : '');
            }
            label.title = label.textContent;
            cell.appendChild(label);

            // --- selection -------------------------------------------------
            cell.addEventListener('click', function (ev) {
                if (ev.shiftKey && anchorIndex !== null) {
                    var lo = Math.min(anchorIndex, idx), hi = Math.max(anchorIndex, idx);
                    for (var i = lo; i <= hi; i++) pages[i].selected = true;
                } else if (ev.ctrlKey || ev.metaKey) {
                    pages[idx].selected = !pages[idx].selected;
                } else {
                    var onlyThis = pages[idx].selected && selectedIdx().length === 1;
                    pages.forEach(function (q) { q.selected = false; });
                    pages[idx].selected = !onlyThis;
                }
                anchorIndex = idx;
                render();
            });

            // --- drag & drop reorder --------------------------------------
            cell.addEventListener('dragstart', function (ev) {
                ev.dataTransfer.effectAllowed = 'move';
                ev.dataTransfer.setData('text/plain', String(idx));
                cell.classList.add('dragging');
            });
            cell.addEventListener('dragend', function () { cell.classList.remove('dragging'); });
            cell.addEventListener('dragover', function (ev) {
                ev.preventDefault();
                ev.dataTransfer.dropEffect = 'move';
                cell.classList.add('drag-over');
            });
            cell.addEventListener('dragleave', function () { cell.classList.remove('drag-over'); });
            cell.addEventListener('drop', function (ev) {
                ev.preventDefault();
                cell.classList.remove('drag-over');
                var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
                var to = idx;
                if (isNaN(from) || from === to) return;
                pushHistory();
                var moved = pages.splice(from, 1)[0];
                pages.splice(to, 0, moved);
                anchorIndex = to;
                render();
            });

            grid.appendChild(cell);
        });

        updateButtons();
        updateStatus();
    }

    function updateStatus() {
        var sel = selectedIdx().length;
        statusLine.textContent =
            pages.length + ' page' + (pages.length === 1 ? '' : 's') + ' in the result' +
            (sel ? '  ·  ' + sel + ' selected'
                 : '  ·  click a page to select (Ctrl/⌘-click or Shift-click for multiple)');
    }

    function updateButtons() {
        var n = selectedIdx().length;
        var has = n > 0;
        btnMoveLeft.disabled    = !has;
        btnMoveRight.disabled   = !has;
        btnRotateLeft.disabled  = !has;
        btnRotateRight.disabled = !has;
        btnDuplicate.disabled   = !has;
        btnDelete.disabled      = !has;
        btnInsertPdf.disabled   = !(pages.length > 0);
        btnInsertBlank.disabled = !(pages.length > 0);
        btnUndo.disabled        = undoStack.length === 0;
        btnRedo.disabled        = redoStack.length === 0;
        saveBtn.disabled        = pages.length === 0 || !sourceFiles.main;
    }

    // ------------------------------------------------------------- selection ops
    btnSelectAll.addEventListener('click', function () {
        pages.forEach(function (p) { p.selected = true; });
        render();
    });
    btnSelectNone.addEventListener('click', function () {
        pages.forEach(function (p) { p.selected = false; });
        anchorIndex = null;
        render();
    });
    btnSelectInvert.addEventListener('click', function () {
        pages.forEach(function (p) { p.selected = !p.selected; });
        render();
    });

    // ------------------------------------------------------------- move
    btnMoveLeft.addEventListener('click', function () {
        var idxs = selectedIdx();
        if (!idxs.length || idxs[0] === 0) return;
        pushHistory();
        idxs.forEach(function (i) {
            var tmp = pages[i - 1];
            pages[i - 1] = pages[i];
            pages[i] = tmp;
        });
        render();
    });
    btnMoveRight.addEventListener('click', function () {
        var idxs = selectedIdx();
        if (!idxs.length || idxs[idxs.length - 1] === pages.length - 1) return;
        pushHistory();
        for (var k = idxs.length - 1; k >= 0; k--) {
            var i = idxs[k];
            var tmp = pages[i + 1];
            pages[i + 1] = pages[i];
            pages[i] = tmp;
        }
        render();
    });

    // ------------------------------------------------------------- rotate
    function rotateSelected(delta) {
        var idxs = selectedIdx();
        if (!idxs.length) return;
        pushHistory();
        idxs.forEach(function (i) {
            var p = pages[i];
            p.rotate = (((p.rotate || 0) + delta) % 360 + 360) % 360;
        });
        render();
    }
    btnRotateLeft.addEventListener('click',  function () { rotateSelected(-90); });
    btnRotateRight.addEventListener('click', function () { rotateSelected(90); });

    // ------------------------------------------------------------- duplicate
    btnDuplicate.addEventListener('click', function () {
        var idxs = selectedIdx();
        if (!idxs.length) return;
        pushHistory();
        // Walk backwards so inserting doesn't disturb earlier indexes.
        for (var k = idxs.length - 1; k >= 0; k--) {
            var i = idxs[k];
            var src = pages[i];
            pages.splice(i + 1, 0, {
                uid: nextUid(), src: src.src, page: src.page,
                rotate: src.rotate, width: src.width, height: src.height,
                label: src.label, selected: false,
                __wpt: src.__wpt, __hpt: src.__hpt,
            });
        }
        render();
    });

    // ------------------------------------------------------------- delete
    btnDelete.addEventListener('click', function () {
        var idxs = selectedIdx();
        if (!idxs.length) return;
        if (idxs.length === pages.length) {
            showError('You cannot delete every page. Keep at least one page in the document.');
            return;
        }
        hideMessages();
        pushHistory();
        for (var k = idxs.length - 1; k >= 0; k--) pages.splice(idxs[k], 1);
        anchorIndex = null;
        render();
    });

    // ------------------------------------------------------------- insert helpers
    function anchorInsertIndex() {
        var idxs = selectedIdx();
        var anchor = idxs.length ? idxs[idxs.length - 1]
                   : (anchorIndex !== null ? anchorIndex : pages.length - 1);
        return (insertPos() === 'before') ? anchor : anchor + 1;
    }

    // ------------------------------------------------------------- insert blank
    btnInsertBlank.addEventListener('click', function () {
        var count = parseInt(blankCount.value, 10);
        if (isNaN(count) || count < 1) {
            showError('Number of blank pages must be at least 1.');
            return;
        }
        if (count > 50) {
            showError('You can insert at most 50 blank pages at a time.');
            return;
        }
        hideMessages();

        // Match the size of the neighbouring page when we can work it out.
        var at = anchorInsertIndex();
        var refIdx = Math.min(Math.max(at - 1, 0), Math.max(pages.length - 1, 0));
        var ref = pages[refIdx];
        var w = 612, h = 792;
        if (ref) {
            if (ref.src === 'blank' && ref.width && ref.height) {
                w = ref.width; h = ref.height;
            } else if (ref.__wpt && ref.__hpt) {
                w = ref.__wpt; h = ref.__hpt;
            }
        }

        pushHistory();
        var items = [];
        for (var i = 0; i < count; i++) {
            items.push({ uid: nextUid(), src: 'blank', width: w, height: h, rotate: 0, selected: false });
        }
        pages.splice.apply(pages, [at, 0].concat(items));
        render();
    });

    // ------------------------------------------------------------- insert file
    btnInsertPdf.addEventListener('click', function () { insertPicker.click(); });

    insertPicker.addEventListener('change', function () {
        var files = Array.from(insertPicker.files || []);
        insertPicker.value = '';
        if (!files.length) return;
        hideMessages();

        var at = anchorInsertIndex();
        btnInsertPdf.disabled = true;
        var originalLabel = btnInsertPdf.innerHTML;
        btnInsertPdf.innerHTML = 'Inserting…';

        var chain = Promise.resolve();
        var newItems = [];
        files.forEach(function (f) {
            chain = chain.then(function () {
                return prepareFile(f).then(function (res) {
                    var key = 'insert_' + (insertSeq++);
                    sourceFiles[key] = res.blob;
                    sourceDocs[key]  = res.doc;
                    sourceNames[key] = f.name;
                    var shortName = f.name.replace(/\.[^.]+$/, '');
                    if (shortName.length > 10) shortName = shortName.slice(0, 9) + '…';
                    for (var pn = 1; pn <= res.doc.numPages; pn++) {
                        newItems.push({
                            uid: nextUid(), src: key, page: pn, rotate: 0,
                            label: shortName, selected: false,
                        });
                    }
                });
            });
        });

        chain.then(function () {
            if (!newItems.length) {
                showError('Those files contained no pages.');
                return;
            }
            pushHistory();
            pages.splice.apply(pages, [at, 0].concat(newItems));
            render();
        }).catch(function (e) {
            showError('Could not insert file: ' + (e && e.message ? e.message : e));
        }).finally(function () {
            btnInsertPdf.disabled = false;
            btnInsertPdf.innerHTML = originalLabel;
            updateButtons();
        });
    });

    // ------------------------------------------------------------- prepare upload
    // Sends the file to the server ('prepare'), which converts non-PDFs.
    // Returns { blob, doc } where doc is the pdf.js document.
    function prepareFile(f) {
        return PDFHelpers.prepareViaServer(form.action, f);
    }

    // ------------------------------------------------------------- main upload
    function resetAll() {
        pages = [];
        Object.keys(sourceDocs).forEach(function (k) {
            try { sourceDocs[k].destroy(); } catch (e) {}
        });
        sourceFiles = {};
        sourceDocs  = {};
        sourceNames = {};
        thumbCache  = {};
        insertSeq   = 0;
        uidSeq      = 0;
        undoStack   = [];
        redoStack   = [];
        anchorIndex = null;
        blankCount.value = 1;
        var afterRadio = document.querySelector('input[name="insertPos"][value="after"]');
        if (afterRadio) afterRadio.checked = true;

        grid.innerHTML = '';
        grid.classList.add('d-none');
        statusLine.classList.add('d-none');
        toolbar.classList.add('d-none');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Save & Download';
        fileInfo.innerHTML = '<em>Upload a file to manage its pages.</em>';
    }

    fileInput.addEventListener('change', function () {
        hideMessages();
        resetAll();
        var f = fileInput.files[0];
        if (!f) return;
        fileInfo.innerHTML = 'Loading <strong>' + f.name + '</strong> (' + humanSize(f.size) + ')…';

        prepareFile(f).then(function (res) {
            sourceFiles.main = res.blob;
            sourceDocs.main  = res.doc;
            sourceNames.main = f.name;

            // Build the initial plan: every page, in order, unrotated.
            var total = res.doc.numPages;
            var tasks = [];
            for (var pn = 1; pn <= total; pn++) {
                pages.push({ uid: nextUid(), src: 'main', page: pn, rotate: 0, selected: false });
                // Record the page size so inserted blanks can match it.
                tasks.push((function (item, n) {
                    return res.doc.getPage(n).then(function (pg) {
                        var v = pg.getViewport({ scale: 1 });
                        item.__wpt = v.width;
                        item.__hpt = v.height;
                    }).catch(function () {});
                })(pages[pages.length - 1], pn));
            }
            fileInfo.innerHTML = '<strong>' + f.name + '</strong> loaded — ' +
                total + ' page' + (total === 1 ? '' : 's') + '.';
            toolbar.classList.remove('d-none');
            grid.classList.remove('d-none');
            statusLine.classList.remove('d-none');
            render();
            return Promise.all(tasks);
        }).catch(function (e) {
            resetAll();
            showError(e && e.message ? e.message : String(e));
        });
    });

    // ------------------------------------------------------------- save
    form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        hideMessages();

        if (!sourceFiles.main) { showError('Please upload a file first.'); return; }
        if (pages.length === 0) {
            showError('The result would have no pages. Please keep at least one page.');
            return;
        }

        // Build the plan. Only send what the server needs.
        var plan = pages.map(function (p) {
            if (p.src === 'blank') {
                return { src: 'blank', width: p.width || 612, height: p.height || 792 };
            }
            return { src: p.src, page: p.page, rotate: p.rotate || 0 };
        });

        // Only upload sources the plan actually references.
        var used = {};
        plan.forEach(function (it) { if (it.src !== 'blank') used[it.src] = true; });

        var fd = new FormData();
        fd.append('action', 'save');
        fd.append('plan', JSON.stringify(plan));
        fd.append('file', sourceFiles.main, 'main.pdf');
        Object.keys(used).forEach(function (key) {
            if (key === 'main') return;
            if (sourceFiles[key]) fd.append(key, sourceFiles[key], key + '.pdf');
        });

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';

        fetch(form.action, { method: 'POST', body: fd })
            .then(function (r) {
                return r.json()
                    .then(function (j) { return { ok: r.ok, body: j }; })
                    .catch(function () { return { ok: false, body: { error: 'Server returned an unexpected response.' } }; });
            })
            .then(function (res) {
                if (res.ok && res.body.success) {
                    summary.innerHTML = 'Your organized PDF is ready — <strong>' +
                        res.body.pages + ' page' + (res.body.pages === 1 ? '' : 's') + '</strong>.';
                    dlBtn.href = res.body.url;
                    dlBtn.setAttribute('download', res.body.name || 'organized.pdf');
                    okBox.classList.remove('d-none');
                } else {
                    showError((res.body && res.body.error) || 'Save failed.');
                }
            })
            .catch(function (e) { showError('Network error: ' + e); })
            .finally(function () {
                saveBtn.textContent = 'Save & Download';
                updateButtons();
            });
    });

    // ------------------------------------------------------------- cancel
    cancelBtn.addEventListener('click', function () {
        form.reset();
        resetAll();
        hideMessages();
    });

    // ------------------------------------------------------------- keyboard
    document.addEventListener('keydown', function (ev) {
        if (!sourceFiles.main) return;
        var ae = document.activeElement;
        if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;

        if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !ev.shiftKey) {
            ev.preventDefault(); btnUndo.click();
        } else if ((ev.ctrlKey || ev.metaKey) &&
                   (ev.key.toLowerCase() === 'y' || (ev.shiftKey && ev.key.toLowerCase() === 'z'))) {
            ev.preventDefault(); btnRedo.click();
        } else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'a') {
            ev.preventDefault(); btnSelectAll.click();
        } else if (ev.key === 'Delete' || ev.key === 'Backspace') {
            if (selectedIdx().length) { ev.preventDefault(); btnDelete.click(); }
        } else if (ev.key === 'ArrowLeft' && !btnMoveLeft.disabled) {
            ev.preventDefault(); btnMoveLeft.click();
        } else if (ev.key === 'ArrowRight' && !btnMoveRight.disabled) {
            ev.preventDefault(); btnMoveRight.click();
        }
    });

    updateButtons();
})();
</script>
{% endblock %}
