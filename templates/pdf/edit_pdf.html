{% extends 'layout.html' %}
{% block content %}
<div class="container main-content main-content--wide">
    <h2 class="pb-2 text-danger">PDF Edit</h2>

    <form id="editForm" action="{{ url_for('edit_pdf_view') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group mt-4">
            <label for="editFile">Select a file</label>
            <input type="file" id="editFile" name="file" accept="{{ UPLOAD_ACCEPT }}" required>
            <small class="text-muted d-block mt-1">
                PDF, JPG, PNG, Word, Excel and PowerPoint files are accepted
                (non-PDFs are converted to PDF first on the server).
            </small>
            <p id="fileInfo" class="mt-2 mb-0 text-muted">
                <em>Upload a file to start editing.</em>
            </p>
        </div>

        <!-- Editing toolbar -->
        <div id="editToolbar" class="edit-toolbar d-none">
            <button type="button" class="btn-action btn-tool active" data-tool="select" title="Select elements">
                <i class="fa fa-mouse-pointer"></i> Select
            </button>
            <button type="button" class="btn-action btn-tool" data-tool="text" title="Add text">
                <i class="fa fa-font"></i> Text
            </button>
            <button type="button" class="btn-action btn-tool" data-tool="image" title="Add an image (JPG/PNG)">
                <i class="fa fa-picture-o"></i> Image
            </button>
            <button type="button" class="btn-action btn-tool" data-tool="draw" title="Freehand draw">
                <i class="fa fa-pencil"></i> Draw
            </button>
            <button type="button" class="btn-action btn-tool" data-tool="highlight" title="Highlight a region">
                <i class="fa fa-paint-brush"></i> Highlight
            </button>

            <span class="divider"></span>

            <button type="button" class="btn-action" id="btnDelete" title="Delete the selected element" disabled>
                <i class="fa fa-trash"></i> Delete
            </button>
            <button type="button" class="btn-action" id="btnSignature" title="Draw & insert a signature">
                <i class="fa fa-pencil-square-o"></i> Signature
            </button>

            <span class="divider"></span>

            <label class="mb-0" title="Color for Draw / Highlight / Text">
                Color
                <input type="color" id="colorPicker" value="#d9534f">
            </label>

            <span class="divider"></span>

            <button type="button" class="btn-action" id="btnUndo" title="Undo" disabled>
                <i class="fa fa-undo"></i> Undo
            </button>
            <button type="button" class="btn-action" id="btnRedo" title="Redo" disabled>
                <i class="fa fa-repeat"></i> Redo
            </button>
        </div>

        <!-- Main layout: thumbnails sidebar + viewer -->
        <div id="editLayout" class="edit-layout d-none">
            <div id="thumbSidebar" class="edit-thumbs"></div>

            <div class="edit-main">
                <div class="edit-nav">
                    <button type="button" class="btn-action" id="prevPage" title="Previous page">
                        <i class="fa fa-chevron-left"></i>
                    </button>
                    <span class="page-indicator">
                        Page
                        <input type="number" id="pageJump" class="form-control form-control-sm page-jump" min="1" value="1">
                        / <span id="totalPages">?</span>
                    </span>
                    <button type="button" class="btn-action" id="nextPage" title="Next page">
                        <i class="fa fa-chevron-right"></i>
                    </button>

                    <span class="divider"></span>

                    <button type="button" class="btn-action" id="zoomOut" title="Zoom out">
                        <i class="fa fa-search-minus"></i>
                    </button>
                    <span class="zoom-indicator" id="zoomLabel">100%</span>
                    <button type="button" class="btn-action" id="zoomIn" title="Zoom in">
                        <i class="fa fa-search-plus"></i>
                    </button>
                    <button type="button" class="btn-action" id="fitPage" title="Fit to page">Fit</button>
                </div>

                <div id="canvasWrap" class="edit-canvas-wrap">
                    <canvas id="editCanvas"></canvas>
                </div>
            </div>
        </div>

        <!-- Hidden inputs -->
        <input type="file" id="imageUpload" accept="image/png,image/jpeg,image/jpg" style="display:none">

        <!-- Signature modal -->
        <div id="signatureModal" class="sig-modal d-none">
            <div class="sig-modal-dialog">
                <h5 class="mb-2">Draw your signature</h5>
                <div class="sig-canvas-wrap">
                    <canvas id="sigCanvas" width="420" height="160"></canvas>
                </div>
                <div class="mt-3 d-flex flex-wrap" style="gap:6px;">
                    <button type="button" class="btn btn-danger btn-sm" id="sigOk">Insert</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="sigClear">Clear</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="sigCancel">Cancel</button>
                </div>
            </div>
        </div>

        <div id="editError"   class="alert alert-danger  mt-3 d-none"></div>
        <div id="editSuccess" class="alert alert-success mt-3 d-none">
            Your edited PDF is ready.
            <a id="editDownloadBtn" href="#" class="btn btn-success btn-sm ml-2" download>
                <i class="fa fa-download"></i> Download
            </a>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-danger mt-2" disabled>Save &amp; Download</button>
        <button type="button" id="cancelBtn" class="btn btn-secondary mt-2">Cancel</button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="{{ url_for('static', filename='pdf_helpers.js') }}"></script>
<script src="{{ url_for('static', filename='sig_creator.js') }}"></script>
<script>
(function () {
    PDFHelpers.setupPdfJs();

    // ---------------------------------------------------------------- state
    var BG_SCALE = 1.5;                 // PDF rendering scale (annotation coordinate system)
    var EXPORT_SCALE = 2.0;             // export resolution when saving

    var originalFile = null;
    var pdfBlob      = null;
    var pdfDoc       = null;
    var totalPages   = 0;
    var currentPage  = 1;
    var displayZoom  = 1.0;
    var baseVpSize   = { w: 0, h: 0 };
    var pageStates   = {};              // { pageNum: fabric JSON }
    var tool         = 'select';
    var toolColor    = '#d9534f';

    var undoStack = [];
    var redoStack = [];
    var inHistoryRestore = false;

    var fabricCanvas = null;
    var renderingPdf = false;

    // ---- DOM refs ---------------------------------------------------------
    var form         = document.getElementById('editForm');
    var fileInput    = document.getElementById('editFile');
    var fileInfo     = document.getElementById('fileInfo');
    var toolbar      = document.getElementById('editToolbar');
    var layout       = document.getElementById('editLayout');
    var thumbSidebar = document.getElementById('thumbSidebar');
    var pageJump     = document.getElementById('pageJump');
    var totalLabel   = document.getElementById('totalPages');
    var zoomLabel    = document.getElementById('zoomLabel');
    var canvasWrap   = document.getElementById('canvasWrap');
    var canvasEl     = document.getElementById('editCanvas');

    var btnPrev      = document.getElementById('prevPage');
    var btnNext      = document.getElementById('nextPage');
    var btnZoomIn    = document.getElementById('zoomIn');
    var btnZoomOut   = document.getElementById('zoomOut');
    var btnFit       = document.getElementById('fitPage');
    var btnDelete    = document.getElementById('btnDelete');
    var btnSignature = document.getElementById('btnSignature');
    var btnUndo      = document.getElementById('btnUndo');
    var btnRedo      = document.getElementById('btnRedo');
    var colorPicker  = document.getElementById('colorPicker');

    var errBox       = document.getElementById('editError');
    var okBox        = document.getElementById('editSuccess');
    var dlBtn        = document.getElementById('editDownloadBtn');
    var saveBtn      = document.getElementById('saveBtn');
    var cancelBtn    = document.getElementById('cancelBtn');

    var imageUpload  = document.getElementById('imageUpload');

    var sigModal     = document.getElementById('signatureModal');
    var sigCanvasEl  = document.getElementById('sigCanvas');
    var sigOk        = document.getElementById('sigOk');
    var sigClear     = document.getElementById('sigClear');
    var sigCancel    = document.getElementById('sigCancel');

    // ---------------------------------------------------------------- helpers
    function humanSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1024 / 1024).toFixed(1) + ' MB';
    }
    function hideMessages() { errBox.classList.add('d-none'); okBox.classList.add('d-none'); }
    function showError(m)   { errBox.textContent = m; errBox.classList.remove('d-none'); }
    function updateUndoButtons() {
        btnUndo.disabled = undoStack.length === 0;
        btnRedo.disabled = redoStack.length === 0;
    }

    // ------------------------------------------------------------ fabric init
    fabricCanvas = new fabric.Canvas(canvasEl, {
        selection: true,
        preserveObjectStacking: true,
    });
    fabricCanvas.freeDrawingBrush.color = toolColor;
    fabricCanvas.freeDrawingBrush.width = 2;

    fabricCanvas.on('selection:created', function () { btnDelete.disabled = false; });
    fabricCanvas.on('selection:updated', function () { btnDelete.disabled = false; });
    fabricCanvas.on('selection:cleared', function () { btnDelete.disabled = true; });

    function snapshotForHistory() {
        return { page: currentPage, json: fabricCanvas.toJSON(['selectable', 'evented']) };
    }
    function pushHistory() {
        if (inHistoryRestore) return;
        undoStack.push(JSON.stringify(snapshotForHistory()));
        if (undoStack.length > 50) undoStack.shift();
        redoStack.length = 0;
        updateUndoButtons();
    }

    fabricCanvas.on('object:added',    function (e) { if (!e.target || !e.target.__noHistory) pushHistory(); });
    fabricCanvas.on('object:modified', pushHistory);
    fabricCanvas.on('object:removed',  function (e) { if (!e.target || !e.target.__noHistory) pushHistory(); });
    fabricCanvas.on('path:created',    pushHistory);

    // ------------------------------------------------------- tool management
    function setTool(t) {
        tool = t;
        document.querySelectorAll('.btn-tool').forEach(function (b) {
            b.classList.toggle('active', b.dataset.tool === t);
        });
        fabricCanvas.isDrawingMode = false;
        fabricCanvas.selection     = (t === 'select');
        fabricCanvas.defaultCursor = 'default';
        fabricCanvas.hoverCursor   = 'move';
        fabricCanvas.forEachObject(function (o) {
            o.selectable = (t === 'select');
            o.evented    = (t === 'select');
        });

        if (t === 'draw') {
            fabricCanvas.isDrawingMode = true;
            fabricCanvas.freeDrawingBrush.color = toolColor;
            fabricCanvas.freeDrawingBrush.width = 2;
        } else if (t === 'highlight' || t === 'text') {
            fabricCanvas.defaultCursor = 'crosshair';
            fabricCanvas.hoverCursor   = 'crosshair';
        } else if (t === 'image') {
            imageUpload.click();
        }
        fabricCanvas.requestRenderAll();
    }

    document.querySelectorAll('.btn-tool').forEach(function (b) {
        b.addEventListener('click', function () { setTool(b.dataset.tool); });
    });

    colorPicker.addEventListener('input', function () {
        toolColor = colorPicker.value;
        fabricCanvas.freeDrawingBrush.color = toolColor;
        var active = fabricCanvas.getActiveObject();
        if (active) {
            if (active.type === 'i-text' || active.type === 'text') {
                active.set('fill', toolColor);
            } else if (active.stroke) {
                active.set('stroke', toolColor);
            }
            fabricCanvas.requestRenderAll();
            pushHistory();
        }
    });

    // ------------------------------------------------------- text + highlight
    var highlightStart = null;
    var highlightRect  = null;

    fabricCanvas.on('mouse:down', function (opt) {
        if (!pdfDoc) return;
        var pointer = fabricCanvas.getPointer(opt.e);

        if (tool === 'text') {
            var txt = new fabric.IText('Type here', {
                left: pointer.x,
                top: pointer.y,
                fill: toolColor,
                fontFamily: 'sans-serif',
                fontSize: 18,
            });
            fabricCanvas.add(txt);
            fabricCanvas.setActiveObject(txt);
            txt.enterEditing();
            setTool('select');
        } else if (tool === 'highlight') {
            highlightStart = pointer;
            highlightRect = new fabric.Rect({
                left: pointer.x, top: pointer.y, width: 0, height: 0,
                fill: toolColor, opacity: 0.35,
                stroke: null, selectable: false, evented: false,
                __noHistory: true,
            });
            fabricCanvas.add(highlightRect);
        }
    });

    fabricCanvas.on('mouse:move', function (opt) {
        if (tool !== 'highlight' || !highlightRect || !highlightStart) return;
        var pt = fabricCanvas.getPointer(opt.e);
        var x = Math.min(pt.x, highlightStart.x);
        var y = Math.min(pt.y, highlightStart.y);
        highlightRect.set({
            left: x,
            top:  y,
            width:  Math.abs(pt.x - highlightStart.x),
            height: Math.abs(pt.y - highlightStart.y),
        });
        fabricCanvas.requestRenderAll();
    });

    fabricCanvas.on('mouse:up', function () {
        if (tool !== 'highlight' || !highlightRect) return;
        var r = highlightRect;
        highlightStart = null;
        highlightRect  = null;
        if (r.width < 6 || r.height < 6) {
            r.__noHistory = true;
            fabricCanvas.remove(r);
        } else {
            r.set({ selectable: true, evented: true });
            r.__noHistory = false;
            pushHistory();
        }
        setTool('select');
    });

    // ------------------------------------------------------- image insertion
    imageUpload.addEventListener('change', function () {
        var f = imageUpload.files[0];
        if (!f) { setTool('select'); return; }
        if (!/^image\/(png|jpe?g)$/i.test(f.type) && !/\.(png|jpe?g)$/i.test(f.name)) {
            showError('Only JPG, JPEG or PNG images can be inserted.');
            imageUpload.value = '';
            setTool('select');
            return;
        }
        var reader = new FileReader();
        reader.onload = function (e) {
            fabric.Image.fromURL(e.target.result, function (img) {
                var maxW = baseVpSize.w * 0.4;
                var maxH = baseVpSize.h * 0.4;
                var s = Math.min(maxW / img.width, maxH / img.height, 1);
                img.set({
                    left: baseVpSize.w * 0.25,
                    top:  baseVpSize.h * 0.25,
                    scaleX: s,
                    scaleY: s,
                });
                fabricCanvas.add(img);
                fabricCanvas.setActiveObject(img);
            });
            imageUpload.value = '';
            setTool('select');
        };
        reader.readAsDataURL(f);
    });

    // ------------------------------------------------------- delete
    btnDelete.addEventListener('click', function () {
        var active = fabricCanvas.getActiveObject();
        if (!active) return;
        if (active.type === 'activeSelection') {
            active.forEachObject(function (o) { fabricCanvas.remove(o); });
            fabricCanvas.discardActiveObject();
        } else {
            fabricCanvas.remove(active);
        }
        fabricCanvas.requestRenderAll();
    });

    // ------------------------------------------------------- undo / redo
    btnUndo.addEventListener('click', function () {
        if (undoStack.length === 0) return;
        var current = JSON.stringify(snapshotForHistory());
        var prev    = undoStack.pop();
        redoStack.push(current);
        restoreHistory(JSON.parse(prev));
    });
    btnRedo.addEventListener('click', function () {
        if (redoStack.length === 0) return;
        var current = JSON.stringify(snapshotForHistory());
        var next    = redoStack.pop();
        undoStack.push(current);
        restoreHistory(JSON.parse(next));
    });
    function restoreHistory(snap) {
        inHistoryRestore = true;
        if (snap.page !== currentPage) {
            pageStates[currentPage] = fabricCanvas.toJSON(['selectable', 'evented']);
            pageStates[snap.page]   = snap.json;
            goToPage(snap.page).then(function () {
                inHistoryRestore = false;
                updateUndoButtons();
            });
            return;
        }
        fabricCanvas.loadFromJSON(snap.json, function () {
            applyToolToObjects();
            fabricCanvas.renderAll();
            inHistoryRestore = false;
            updateUndoButtons();
        });
    }

       // --------------------------------------------------- signature
    // Delegates to the shared SignatureCreator (Draw / Type / Upload image)
    // introduced by the Sign PDF tool. Honors the "unify signature UX"
    // requirement without changing how the PDF Edit canvas works.
    btnSignature.addEventListener('click', function () {
        if (!baseVpSize.w) return;
        SignatureCreator.open({
            title: 'Create signature',
            kinds: ['signature', 'initials'],
            onDone: function (dataUrl /*, kind */) {
                fabric.Image.fromURL(dataUrl, function (img) {
                    var maxW = baseVpSize.w * 0.4;
                    var maxH = baseVpSize.h * 0.25;
                    var s = Math.min(maxW / img.width, maxH / img.height, 1);
                    if (!isFinite(s) || s <= 0) s = 0.5;
                    img.set({
                        left: baseVpSize.w * 0.5 - (img.width * s) / 2,
                        top:  baseVpSize.h * 0.7,
                        scaleX: s,
                        scaleY: s,
                    });
                    fabricCanvas.add(img);
                    fabricCanvas.setActiveObject(img);
                    setTool('select');
                });
            }
        });
    });
    // The legacy in-template signatureModal is unused now; keep it hidden.
    if (sigModal) sigModal.classList.add('d-none');

    // ----------------------------------------------------- page navigation
    btnPrev.addEventListener('click', function () { goToPage(currentPage - 1); });
    btnNext.addEventListener('click', function () { goToPage(currentPage + 1); });
    pageJump.addEventListener('change', function () { goToPage(parseInt(pageJump.value, 10) || 1); });

    function goToPage(p) {
        if (!pdfDoc) return Promise.resolve();
        p = Math.max(1, Math.min(totalPages, p));
        if (p === currentPage && !renderingPdf) return Promise.resolve();
        savePageState();
        currentPage = p;
        return renderPage(currentPage).then(updateThumbs);
    }

    // ----------------------------------------------------- zoom
    btnZoomIn.addEventListener('click',  function () { setDisplayZoom(displayZoom * 1.25); });
    btnZoomOut.addEventListener('click', function () { setDisplayZoom(displayZoom / 1.25); });
    btnFit.addEventListener('click', function () {
        if (!baseVpSize.w) return;
        var avail = canvasWrap.clientWidth - 16;
        setDisplayZoom(Math.max(0.25, Math.min(4, avail / baseVpSize.w)));
    });
    function setDisplayZoom(z) {
        displayZoom = Math.max(0.25, Math.min(4, z));
        zoomLabel.textContent = Math.round(displayZoom * 100) + '%';
        fabricCanvas.setZoom(displayZoom);
        fabricCanvas.setDimensions({
            width:  baseVpSize.w * displayZoom,
            height: baseVpSize.h * displayZoom,
        });
        fabricCanvas.requestRenderAll();
    }

    // --------------------------------------------------- state save/load
    function savePageState() {
        if (!pdfDoc) return;
        pageStates[currentPage] = fabricCanvas.toJSON(['selectable', 'evented']);
    }
    function applyToolToObjects() {
        var isSelect = (tool === 'select');
        fabricCanvas.forEachObject(function (o) {
            o.selectable = isSelect;
            o.evented    = isSelect;
        });
    }

    // --------------------------------------------------- page render
    function renderPage(pageNum) {
        if (!pdfDoc) return Promise.resolve();
        renderingPdf = true;
        pageJump.value = String(pageNum);
        totalLabel.textContent = String(totalPages);

        return pdfDoc.getPage(pageNum).then(function (page) {
            var vp = page.getViewport({ scale: BG_SCALE });
            baseVpSize.w = vp.width;
            baseVpSize.h = vp.height;

            fabricCanvas.clear();
            fabricCanvas.setDimensions({ width: vp.width * displayZoom, height: vp.height * displayZoom });
            fabricCanvas.setZoom(displayZoom);

            var off = document.createElement('canvas');
            off.width  = vp.width;
            off.height = vp.height;
            return page.render({ canvasContext: off.getContext('2d'), viewport: vp })
                .promise
                .then(function () { return off; });
        }).then(function (off) {
            return new Promise(function (resolve) {
                fabric.Image.fromURL(off.toDataURL(), function (img) {
                    img.set({
                        left: 0, top: 0,
                        selectable: false, evented: false,
                        scaleX: 1, scaleY: 1,
                    });
                    fabricCanvas.setBackgroundImage(img, function () {
                        var st = pageStates[currentPage];
                        if (st) {
                            fabricCanvas.loadFromJSON(st, function () {
                                applyToolToObjects();
                                fabricCanvas.renderAll();
                                resolve();
                            });
                        } else {
                            fabricCanvas.renderAll();
                            resolve();
                        }
                    });
                });
            });
        }).then(function () {
            renderingPdf = false;
        }).catch(function (err) {
            renderingPdf = false;
            showError('Failed to render page: ' + (err && err.message ? err.message : err));
        });
    }

    // --------------------------------------------------- thumbnails
    function buildThumbs() {
        thumbSidebar.innerHTML = '';
        for (var p = 1; p <= totalPages; p++) {
            (function (pn) {
                var cell = document.createElement('div');
                cell.className = 'edit-thumb' + (pn === currentPage ? ' active' : '');
                cell.dataset.page = pn;
                var canvas = document.createElement('canvas');
                cell.appendChild(canvas);
                var lab = document.createElement('span');
                lab.className = 'thumb-label';
                lab.innerHTML = 'Page ' + pn + '<span class="thumb-dot" style="display:none"></span>';
                cell.appendChild(lab);
                cell.addEventListener('click', function () { goToPage(pn); });
                thumbSidebar.appendChild(cell);

                pdfDoc.getPage(pn).then(function (page) {
                    var v = page.getViewport({ scale: 0.18 });
                    canvas.width = v.width;
                    canvas.height = v.height;
                    page.render({ canvasContext: canvas.getContext('2d'), viewport: v });
                }).catch(function () {});
            })(p);
        }
    }
    function updateThumbs() {
        Array.from(thumbSidebar.children).forEach(function (c) {
            var pn = parseInt(c.dataset.page, 10);
            c.classList.toggle('active', pn === currentPage);
            var dot = c.querySelector('.thumb-dot');
            if (dot) {
                var st = pageStates[pn];
                dot.style.display = (st && st.objects && st.objects.length) ? 'inline-block' : 'none';
            }
        });
    }

    // --------------------------------------------------- file pick + prepare
    function resetEditor() {
        originalFile = null;
        pdfBlob      = null;
        if (pdfDoc) { try { pdfDoc.destroy(); } catch (e) {} pdfDoc = null; }
        totalPages   = 0;
        currentPage  = 1;
        displayZoom  = 1.0;
        baseVpSize   = { w: 0, h: 0 };
        pageStates   = {};
        undoStack    = [];
        redoStack    = [];
        updateUndoButtons();

        fabricCanvas.clear();
        fabricCanvas.setDimensions({ width: 0, height: 0 });
        thumbSidebar.innerHTML = '';
        toolbar.classList.add('d-none');
        layout.classList.add('d-none');
        sigModal.classList.add('d-none');
        saveBtn.disabled = true;
        fileInfo.innerHTML = '<em>Upload a file to start editing.</em>';
        setTool('select');
    }

    fileInput.addEventListener('change', function () {
        hideMessages();
        resetEditor();
        var f = fileInput.files[0];
        if (!f) return;
        originalFile = f;
        fileInfo.innerHTML = 'Loading <strong>' + f.name + '</strong> (' + humanSize(f.size) + ')…';
        prepareAndLoad(f);
    });

    function prepareAndLoad(f) {
        PDFHelpers.prepareViaServer(form.action, f)
            .then(function (res) {
                pdfBlob = res.blob;
                return res.doc;
            })
            .then(function (doc) {
                pdfDoc      = doc;
                totalPages  = doc.numPages;
                currentPage = 1;
                pageJump.max = totalPages;
                toolbar.classList.remove('d-none');
                layout.classList.remove('d-none');
                fileInfo.innerHTML =
                    '<strong>' + originalFile.name + '</strong> loaded — ' +
                    totalPages + ' page' + (totalPages === 1 ? '' : 's') + '.';
                buildThumbs();
                return renderPage(currentPage);
            })
            .then(function () {
                btnFit.click();
                saveBtn.disabled = false;
            })
            .catch(function (e) {
                resetEditor();
                showError(e.message || String(e));
            });
    }

    // --------------------------------------------------- save
    function renderPageToBlob(pageNum) {
        return pdfDoc.getPage(pageNum).then(function (page) {
            var vp = page.getViewport({ scale: EXPORT_SCALE });
            var pdfEl = document.createElement('canvas');
            pdfEl.width  = vp.width;
            pdfEl.height = vp.height;
            return page.render({ canvasContext: pdfEl.getContext('2d'), viewport: vp })
                .promise
                .then(function () { return { pdfEl: pdfEl, vp: vp }; });
        }).then(function (ctx) {
            var st = pageStates[pageNum];
            if (!st || !st.objects || st.objects.length === 0) {
                return new Promise(function (res) { ctx.pdfEl.toBlob(res, 'image/png'); });
            }
            var scaleFactor = EXPORT_SCALE / BG_SCALE;
            var annEl = document.createElement('canvas');
            annEl.width  = ctx.vp.width;
            annEl.height = ctx.vp.height;
            var tmp = new fabric.StaticCanvas(annEl, {
                width:  ctx.vp.width,
                height: ctx.vp.height,
                enableRetinaScaling: false,
            });
            return new Promise(function (resolve) {
                tmp.loadFromJSON(st, function () {
                    tmp.getObjects().forEach(function (o) {
                        o.set({
                            left:   (o.left   || 0) * scaleFactor,
                            top:    (o.top    || 0) * scaleFactor,
                            scaleX: (o.scaleX || 1) * scaleFactor,
                            scaleY: (o.scaleY || 1) * scaleFactor,
                        });
                        if (o.strokeWidth) o.set('strokeWidth', o.strokeWidth * scaleFactor);
                        o.setCoords();
                    });
                    tmp.renderAll();
                    ctx.pdfEl.getContext('2d').drawImage(annEl, 0, 0);
                    tmp.dispose();
                    ctx.pdfEl.toBlob(resolve, 'image/png');
                });
            });
        });
    }

    form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        hideMessages();
        if (!pdfDoc) { showError('Please upload a file first.'); return; }
        savePageState();

        saveBtn.disabled = true;
        saveBtn.textContent = 'Rendering…';

        var fd = new FormData();
        fd.append('action', 'save');
        fd.append('page_count', String(totalPages));

        var chain = Promise.resolve();
        for (var p = 1; p <= totalPages; p++) {
            (function (pn) {
                chain = chain.then(function () {
                    saveBtn.textContent = 'Rendering page ' + pn + '/' + totalPages + '…';
                    return renderPageToBlob(pn).then(function (blob) {
                        fd.append('page_' + pn, blob, 'page_' + pn + '.png');
                    });
                });
            })(p);
        }

        chain
            .then(function () {
                saveBtn.textContent = 'Uploading…';
                return fetch(form.action, { method: 'POST', body: fd });
            })
            .then(function (r) {
                return r.json()
                    .then(function (j) { return { ok: r.ok, body: j }; })
                    .catch(function () { return { ok: false, body: { error: 'Server returned an unexpected response.' } }; });
            })
            .then(function (res) {
                if (res.ok && res.body.success) {
                    dlBtn.href = res.body.url;
                    dlBtn.setAttribute('download', res.body.name || 'edited.pdf');
                    okBox.classList.remove('d-none');
                } else {
                    showError((res.body && res.body.error) || 'Save failed.');
                }
            })
            .catch(function (e) { showError('Network error: ' + e); })
            .finally(function () {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save & Download';
            });
    });

    // --------------------------------------------------- cancel
    cancelBtn.addEventListener('click', function () {
        form.reset();
        resetEditor();
        hideMessages();
    });

    // --------------------------------------------------- keyboard
    document.addEventListener('keydown', function (ev) {
        if (!pdfDoc) return;
        var ae = document.activeElement;
        if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
        if (fabricCanvas.getActiveObject() && fabricCanvas.getActiveObject().isEditing) return;

        if ((ev.ctrlKey || ev.metaKey) && ev.key === 'z') { ev.preventDefault(); btnUndo.click(); }
        else if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'y' || (ev.shiftKey && ev.key === 'Z'))) {
            ev.preventDefault(); btnRedo.click();
        } else if (ev.key === 'Delete' || ev.key === 'Backspace') {
            if (fabricCanvas.getActiveObject()) { ev.preventDefault(); btnDelete.click(); }
        }
    });

    setTool('select');
    updateUndoButtons();
})();
</script>
{% endblock %}
