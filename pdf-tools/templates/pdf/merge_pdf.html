{% extends 'layout.html' %}
{% block content %}
<div class="container main-content">
    <h2 class="pb-2 text-danger">Merge PDF</h2>
    <form id="mergeForm" action="{{ url_for('merge_pdf') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group mt-4">
            <label for="filePicker">Add one or more files (PDF, JPG, PNG, Word, Excel, PowerPoint).
                You can add more in batches:</label>
            <input type="file" id="filePicker" accept="{{ UPLOAD_ACCEPT }}" multiple>
            <small class="text-muted d-block mt-1">
                Drag items in the list below to change their order.
                Non-PDF files are converted to PDF before merging.
            </small>
        </div>
        <ul id="fileList" class="list-unstyled mt-3"></ul>
        <div id="mergeError" class="alert alert-danger mt-3 d-none"></div>
        <div id="mergeSuccess" class="alert alert-success mt-3 d-none">
            Your merged PDF is ready.
            <a id="mergeDownloadBtn" href="#" class="btn btn-success btn-sm ml-2" download>
                <i class="fa fa-download"></i> Download
            </a>
        </div>
        <button type="submit" id="mergeBtn" class="btn btn-danger mt-2">Merge</button>
        <button type="button" id="clearBtn" class="btn btn-secondary mt-2">Clear All</button>
    </form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="{{ url_for('static', filename='pdf_helpers.js') }}"></script>
<script>
(function () {
    PDFHelpers.setupPdfJs();
    var selectedFiles = [];
    var picker   = document.getElementById('filePicker');
    var listEl   = document.getElementById('fileList');
    var form     = document.getElementById('mergeForm');
    var errBox   = document.getElementById('mergeError');
    var okBox    = document.getElementById('mergeSuccess');
    var dlBtn    = document.getElementById('mergeDownloadBtn');
    var mergeBtn = document.getElementById('mergeBtn');
    var clearBtn = document.getElementById('clearBtn');
    function humanSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1024 / 1024).toFixed(1) + ' MB';
    }
    var GENERIC_ICON =
        'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
            '<rect x="3" y="2" width="18" height="20" rx="2" fill="#ddd" stroke="#888"/>' +
            '<text x="12" y="15" font-family="sans-serif" font-size="6" ' +
            'text-anchor="middle" fill="#555">FILE</text></svg>');
    function isPdf(file)    { return file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''); }
    function isImage(file)  { return /^image\/(jpeg|png)$/.test(file.type) || /\.(jpe?g|png)$/i.test(file.name || ''); }
    function isSupported(file) {
        return isPdf(file) || isImage(file) || /\.(docx?|xlsx?|pptx?)$/i.test(file.name || '');
    }
    function renderThumbnail(file, imgEl) {
        if (isPdf(file)) {
            PDFHelpers.loadPdfFromFile(file).then(function (pdf) {
                var canvas = document.createElement('canvas');
                return PDFHelpers.renderPageToCanvas(pdf, 1, canvas, 0.2).then(function () {
                    imgEl.src = canvas.toDataURL();
                });
            }).catch(function () { imgEl.src = GENERIC_ICON; });
        } else if (isImage(file)) {
            var url = URL.createObjectURL(file);
            imgEl.src = url;
            imgEl.addEventListener('load', function () { URL.revokeObjectURL(url); }, { once: true });
        } else {
            imgEl.src = GENERIC_ICON;
        }
    }
    function renderList() {
        listEl.innerHTML = '';
        if (selectedFiles.length === 0) {
            var empty = document.createElement('li');
            empty.className = 'text-muted';
            empty.innerHTML = '<em>No files selected yet.</em>';
            listEl.appendChild(empty);
            return;
        }
        selectedFiles.forEach(function (f, idx) {
            var li = document.createElement('li');
            li.className = 'file-list-item';
            li.draggable = true;
            li.dataset.index = idx;
            var handle = document.createElement('span');
            handle.className = 'drag-handle';
            handle.title = 'Drag to reorder';
            handle.innerHTML = '<i class="fa fa-bars"></i>';
            li.appendChild(handle);
            var thumb = document.createElement('img');
            thumb.alt = 'thumbnail';
            thumb.className = 'file-thumb';
            li.appendChild(thumb);
            renderThumbnail(f, thumb);
            var info = document.createElement('span');
            info.className = 'file-name';
            info.title = f.name;
            info.textContent = (idx + 1) + '. ' + f.name + '  (' + humanSize(f.size) + ')';
            li.appendChild(info);
            var del = document.createElement('button');
            del.type = 'button';
            del.className = 'btn-action';
            del.innerHTML = '<i class="fa fa-trash"></i>';
            del.title = 'Remove this file';
            del.onclick = function () { selectedFiles.splice(idx, 1); renderList(); };
            li.appendChild(del);
            li.addEventListener('dragstart', function (ev) {
                ev.dataTransfer.effectAllowed = 'move';
                ev.dataTransfer.setData('text/plain', String(idx));
                li.classList.add('dragging');
            });
            li.addEventListener('dragend', function () { li.classList.remove('dragging'); });
            li.addEventListener('dragover', function (ev) {
                ev.preventDefault();
                ev.dataTransfer.dropEffect = 'move';
                li.classList.add('drag-over');
            });
            li.addEventListener('dragleave', function () { li.classList.remove('drag-over'); });
            li.addEventListener('drop', function (ev) {
                ev.preventDefault();
                li.classList.remove('drag-over');
                var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
                var to = idx;
                if (isNaN(from) || from === to) return;
                var moved = selectedFiles.splice(from, 1)[0];
                selectedFiles.splice(to, 0, moved);
                renderList();
            });
            listEl.appendChild(li);
        });
    }
    picker.addEventListener('change', function () {
        var skipped = [];
        Array.from(picker.files).forEach(function (f) {
            if (isSupported(f)) selectedFiles.push(f);
            else skipped.push(f.name);
        });
        picker.value = '';
        renderList();
        if (skipped.length) {
            errBox.textContent = 'Skipped unsupported file(s): ' + skipped.join(', ') +
                '. Allowed: PDF, JPG, JPEG, PNG, DOC, DOCX, XLS, XLSX, PPT, PPTX.';
            errBox.classList.remove('d-none');
        } else {
            errBox.classList.add('d-none');
        }
    });
    clearBtn.addEventListener('click', function () {
        selectedFiles = [];
        renderList();
        errBox.classList.add('d-none');
        okBox.classList.add('d-none');
    });
    form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        errBox.classList.add('d-none');
        okBox.classList.add('d-none');
        if (selectedFiles.length < 2) {
            errBox.textContent = 'Please add at least two files to merge.';
            errBox.classList.remove('d-none');
            return;
        }
        var fd = new FormData();
        selectedFiles.forEach(function (f) { fd.append('files', f, f.name); });
        mergeBtn.disabled = true;
        mergeBtn.textContent = 'Merging...';
        fetch(form.action, { method: 'POST', body: fd })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
            .then(function (res) {
                if (res.ok && res.body.success) {
                    dlBtn.href = res.body.url;
                    dlBtn.setAttribute('download', res.body.name || 'merged.pdf');
                    okBox.classList.remove('d-none');
                } else {
                    errBox.textContent = (res.body && res.body.error) || 'Merge failed.';
                    errBox.classList.remove('d-none');
                }
            })
            .catch(function (e) {
                errBox.textContent = 'Network error: ' + e;
                errBox.classList.remove('d-none');
            })
            .finally(function () {
                mergeBtn.disabled = false;
                mergeBtn.textContent = 'Merge';
            });
    });
    renderList();
})();
</script>
{% endblock %}
