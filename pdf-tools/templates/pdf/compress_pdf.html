{% extends 'layout.html' %}
{% block content %}
<div class="container main-content">
    <h2 class="pb-2 text-danger">PDF Compression</h2>
    <form id="compressForm" action="{{ url_for('compress_pdf_view') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group mt-4">
            <label for="compressFile">Select a file to compress (PDF, or an image / Office doc that will be converted first)</label>
            <input type="file" id="compressFile" name="file" accept="{{ UPLOAD_ACCEPT }}" required>
            <p id="fileInfo" class="mt-2 mb-0 text-muted"><em>Upload a PDF to see its current size.</em></p>
        </div>
        <div class="form-group">
            <label for="targetSize">Target file size</label>
            <div class="size-input-row">
                <input type="number" id="targetSize" name="targetSize"
                       class="form-control" min="1" step="any" placeholder="e.g. 500">
                <select id="targetUnit" name="targetUnit" class="form-control">
                    <option value="KB" selected>KB</option>
                    <option value="MB">MB</option>
                </select>
            </div>
            <small id="targetHint" class="text-muted d-block mt-1">
                Choose a size smaller than the original. Text-only PDFs have a natural
                size floor and may not reach very small targets.
            </small>
        </div>
        <div id="compressError" class="alert alert-danger mt-3 d-none"></div>
        <div id="compressWarn"  class="alert alert-warning mt-3 d-none"></div>
        <div id="compressSuccess" class="alert alert-success mt-3 d-none">
            <div id="compressSummary"></div>
            <a id="compressDownloadBtn" href="#" class="btn btn-success btn-sm mt-2" download>
                <i class="fa fa-download"></i> Download
            </a>
        </div>
        <button type="submit" id="compressBtn" class="btn btn-danger">Compress</button>
        <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
    </form>
</div>
<script>
(function () {
    var form        = document.getElementById('compressForm');
    var fileInput   = document.getElementById('compressFile');
    var fileInfo    = document.getElementById('fileInfo');
    var targetInput = document.getElementById('targetSize');
    var unitSelect  = document.getElementById('targetUnit');
    var errBox      = document.getElementById('compressError');
    var warnBox     = document.getElementById('compressWarn');
    var okBox       = document.getElementById('compressSuccess');
    var summary     = document.getElementById('compressSummary');
    var dlBtn       = document.getElementById('compressDownloadBtn');
    var compressBtn = document.getElementById('compressBtn');
    var cancelBtn   = document.getElementById('cancelBtn');
    var originalBytes = 0;
    function humanSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1024 * 1024) return (b / 1024).toFixed(2) + ' KB';
        return (b / 1024 / 1024).toFixed(2) + ' MB';
    }
    function hideMessages() {
        errBox.classList.add('d-none');
        warnBox.classList.add('d-none');
        okBox.classList.add('d-none');
    }
    function showError(msg) {
        errBox.textContent = msg;
        errBox.classList.remove('d-none');
    }
    function resetScreen() {
        form.reset();
        originalBytes = 0;
        fileInfo.innerHTML = '<em>Upload a PDF to see its current size.</em>';
        targetInput.value = '';
        unitSelect.value = 'KB';
        hideMessages();
        compressBtn.disabled = false;
        compressBtn.textContent = 'Compress';
    }
    fileInput.addEventListener('change', function () {
        hideMessages();
        var f = fileInput.files[0];
        if (!f) {
            originalBytes = 0;
            fileInfo.innerHTML = '<em>Upload a PDF to see its current size.</em>';
            return;
        }
        originalBytes = f.size;
        fileInfo.innerHTML = '<strong>' + f.name + '</strong> &mdash; current size: <strong>' +
                             humanSize(f.size) + '</strong>';
        // Helpful default: aim for ~60% of the original.
        if (!targetInput.value) {
            var suggestKB = Math.max(1, Math.round((f.size * 0.6) / 1024));
            if (suggestKB >= 1024) {
                targetInput.value = (suggestKB / 1024).toFixed(1);
                unitSelect.value = 'MB';
            } else {
                targetInput.value = suggestKB;
                unitSelect.value = 'KB';
            }
        }
    });
    cancelBtn.addEventListener('click', resetScreen);
    form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        hideMessages();
        var f = fileInput.files[0];
        if (!f) {
            showError('Please upload a PDF file.');
            return;
        }
        if (f.type && f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) {
            showError('Please upload a file in PDF format.');
            return;
        }
        var raw = (targetInput.value || '').trim();
        if (!raw) {
            showError('Please enter a target file size.');
            return;
        }
        var amount = parseFloat(raw);
        if (isNaN(amount) || amount <= 0) {
            showError('Target file size must be a number greater than zero.');
            return;
        }
        var multiplier = unitSelect.value === 'MB' ? 1024 * 1024 : 1024;
        var targetBytes = Math.round(amount * multiplier);
        if (targetBytes < 1024) {
            showError('Target file size is unrealistically small; use at least 1 KB.');
            return;
        }
        if (originalBytes && targetBytes >= originalBytes) {
            showError('The target size (' + humanSize(targetBytes) + ') is not smaller than the ' +
                      'original file (' + humanSize(originalBytes) + '). Please choose a smaller target.');
            return;
        }
        var fd = new FormData();
        fd.append('file', f, f.name);
        fd.append('targetSize', raw);
        fd.append('targetUnit', unitSelect.value);
        compressBtn.disabled = true;
        compressBtn.textContent = 'Compressing...';
        fetch(form.action, { method: 'POST', body: fd })
            .then(function (r) {
                return r.json()
                    .then(function (j) { return { ok: r.ok, body: j }; })
                    .catch(function () { return { ok: false, body: { error: 'Server returned an unexpected response.' } }; });
            })
            .then(function (res) {
                if (res.ok && res.body.success) {
                    var b = res.body;
                    summary.innerHTML =
                        'Original: <strong>' + b.original_size_h + '</strong> &rarr; ' +
                        'Compressed: <strong>' + b.final_size_h + '</strong> ' +
                        '(saved ' + b.ratio + '%). Target was ' + b.target_size_h + '.';
                    dlBtn.href = b.url;
                    dlBtn.setAttribute('download', b.name || 'compressed.pdf');
                    okBox.classList.remove('d-none');
                    if (!b.reached) {
                        warnBox.textContent = b.note ||
                            'The target size could not be fully reached, but the smallest possible version is ready.';
                        warnBox.classList.remove('d-none');
                    }
                } else {
                    showError((res.body && res.body.error) || 'Compression failed.');
                }
            })
            .catch(function (e) {
                showError('Network error: ' + e);
            })
            .finally(function () {
                compressBtn.disabled = false;
                compressBtn.textContent = 'Compress';
            });
    });
})();
</script>
{% endblock %}
